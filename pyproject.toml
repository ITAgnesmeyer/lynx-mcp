[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lynx-mcp"
version = "0.0.1"
description = "MCP-Server (stdio) für die lokale lynx-control/1-API einer laufenden LYNX-SHARE-Instanz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LYNX-MCP contributors" }]
keywords = ["mcp", "model-context-protocol", "lynx", "share", "audio", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=2.3",
]

[project.scripts]
# Start über uv/uvx: `uvx lynx-mcp` bzw. `uv tool run lynx-mcp`
lynx-mcp = "lynx_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Ka1-S/LYNX-SHARE"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["lynx_mcp"]
